<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EC" />
  <meta name="description" content="Simple household worker attendance and payment tracker." />
  <link rel="icon" type="image/x-icon" href="/icons/household-help-favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/household-help-icon-48x48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/household-help-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/household-help-icon-512x512.png">
  <link rel="apple-touch-icon" href="/icons/household-help-icon-192x192.png">
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6" />
  <title>Household Attendance</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="avatar-mark" id="avatarInitial">·</div>
      <div class="topbar-mid">
        <p class="eyebrow">My Household</p>
        <div class="topbar-title" id="screenTitle">Today</div>
      </div>
      <button id="accountBtn" class="topbar-action" aria-label="Account" aria-expanded="false">⋯</button>
      <div id="accountMenu" class="account-menu hidden" role="menu">
        <div class="who"><p class="eyebrow" style="margin-bottom:3px">Signed in</p><div class="email" id="accountEmail"></div></div>
        <button id="householdBtn" role="menuitem">⌂&nbsp; Household members</button>
        <button id="refreshBtn" role="menuitem">↻&nbsp; Refresh data</button>
        <button id="logoutBtn" role="menuitem">⎋&nbsp; Sign out</button>
      </div>
    </header>
    <main>
      <section id="loginView" class="view hidden"><div class="welcome-card"><div class="brand-mark">✓</div><p class="eyebrow">HOUSEHOLD ATTENDANCE</p><h2>Keep attendance and payments simple.</h2><p>Sign in with Google to keep your household data safely synced.</p><button id="googleSignInBtn" class="primary-btn">Continue with Google</button></div></section>
      <section id="loadingView" class="view"><div class="loading-card">
        <svg class="loading-anim" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="6" width="5" height="12" rx="2.5" fill="var(--green)"/>
          <rect x="41" y="6" width="5" height="12" rx="2.5" fill="var(--green)"/>
          <rect x="9" y="14" width="46" height="42" rx="7" fill="var(--surface)" stroke="var(--green)" stroke-width="2.5"/>
          <rect x="9" y="14" width="46" height="13" rx="7" fill="var(--green)"/>
          <path class="loading-check" d="M20 36 L29 45 L46 24" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Refreshing household data…</p>
      </div></section>
      <section id="mainView" class="view hidden">
        <div id="staleBanner" class="notice hidden"></div>
        <div id="todayPanel" class="panel"></div><div id="calendarPanel" class="panel hidden"></div><div id="payPanel" class="panel hidden"></div><div id="workersPanel" class="panel hidden"></div><div id="detailsPanel" class="panel hidden"></div>
      </section>
    </main>
    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-view="today"><span class="nav-icon">⌂</span><span>Today</span></button>
      <button class="tab" data-view="calendar"><span class="nav-icon">▦</span><span>Calendar</span></button>
      <button class="tab" data-view="pay"><span class="nav-icon">₹</span><span>Pay</span></button>
      <button class="tab" data-view="workers"><span class="nav-icon">◍</span><span>Workers</span></button>
    </nav>

    <div id="householdOverlay" class="household-overlay hidden">
      <button class="back-btn" id="closeHousehold">← Back</button>
      <main id="householdPanel" style="padding:4px 16px 40px"></main>
    </div>

    <div id="sheetBackdrop" class="sheet-backdrop"></div>
    <div class="sheet" id="attendanceSheet">
      <div class="grabber"></div>
      <div class="sheet-header">
        <div class="avatar" id="sheetAvatar" style="width:44px;height:44px"></div>
        <div><div class="name" id="sheetName"></div><div class="sub" id="sheetSub"></div></div>
      </div>
      <div class="shift-toggle hidden" id="shiftToggle">
        <button data-shift="morning">Morning</button>
        <button data-shift="evening">Evening</button>
      </div>
      <div class="state-grid">
        <button class="state-btn present" data-state="present"><span class="ic">✓</span>Present</button>
        <button class="state-btn absent" data-state="absent"><span class="ic">✕</span>Absent</button>
        <button class="state-btn leave" data-state="leave"><span class="ic">☾</span>Leave</button>
      </div>
      <p class="sheet-note">Half Day is worked out automatically once both shifts are marked.</p>
    </div>

    <div id="toast" class="toast hidden" role="alert"></div>
    <div id="modal" class="modal hidden" aria-modal="true" role="dialog"><div class="modal-card"><button id="closeModal" class="close-btn" aria-label="Close">×</button><div id="modalContent"></div></div></div>
  </div>
  <script type="module" src="app.js?v=6"></script><script type="module" src="settlement.js?v=6"></script><script type="module" src="navigation.js?v=6"></script>
</body>
</html>
